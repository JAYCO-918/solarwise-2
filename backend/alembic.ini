# Alembic configuration for development use (`alembic revision --autogenerate`, `alembic upgrade head`).
# The application applies migrations itself at start-up; see solarwise/db/migrate.py.
[alembic]
script_location = solarwise/migrations
prepend_sys_path = .
# The database URL is taken from SOLARWISE_DATABASE_URL / DATABASE_URL (see solarwise/migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
